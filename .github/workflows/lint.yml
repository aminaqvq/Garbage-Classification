name: Python Lint

on:
  push:
    branches: [main, master]
    paths:
      - '**.py'
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check rpi/ training/ --ignore E501,E402,F841 || true
          echo "Lint complete (warnings are non-blocking)"
